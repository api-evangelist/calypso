name: Calypso
description: >-
  APIs and developer resources for Nasdaq Calypso (formerly Adenza / Calypso
  Technology), a cross-asset front-to-back capital markets technology platform
  for trading, risk management, collateral, treasury, processing, and accounting
  used by banks, asset managers, central banks, and clearing houses worldwide.
