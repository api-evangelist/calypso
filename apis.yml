    url: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/front-office
- name: Calypso Middle Office and Trading Risk API
  description: >-
    Enables integration with Calypso middle office and trading risk capabilities
    including market risk, credit risk, clearing risk, and liquidity risk
    metrics. Supports VaR calculations, stress testing, back testing, and
    compliance management based on internal and regulatory mandates.
  image: https://www.calypso.com/favicon.ico
  humanURL: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/middle-office-trading-risk
  baseURL: https://api.calypso.example.com/v1
  tags:
  - Risk Management
  - Market Risk
  - Credit Risk
  - Compliance
  properties:
  - type: Documentation
    url: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/middle-office-trading-risk
- name: Calypso Treasury API
  description: >-
    Provides access to Calypso treasury management capabilities for front-to-back
    treasury operations including cross-asset trading decisions, analytics, risk
    tools, real-time monitoring, and management of treasury positions across
    cash and derivatives products.
  image: https://www.calypso.com/favicon.ico
  humanURL: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/treasury
  baseURL: https://api.calypso.example.com/v1
