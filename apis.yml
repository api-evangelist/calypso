  - OTC
  - Exchange Traded
  properties:
  - type: Documentation
    url: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/clearing
- name: Calypso Post-Trade Processing API
  description: >-
    Enables integration with Calypso back-office processing capabilities
    including trade comparison, netting, settlement, profitability analysis,
    corporate actions, accounting, and regulatory reporting. Supports full
    straight-through processing with exception-based user interaction.
  image: https://www.calypso.com/favicon.ico
  humanURL: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/post-trade-processing
  baseURL: https://api.calypso.example.com/v1
  tags:
  - Post-Trade
