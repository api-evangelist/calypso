  - Accounting
  - Back Office
  properties:
  - type: Documentation
    url: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/post-trade-processing
- name: Calypso Reserve and Monetary Policy Management API
  description: >-
    Provides integration capabilities for central bank reserve management and
    monetary policy operations on the Calypso platform. Supports monitoring and
    managing debt and liquidity, regulating financial system liquidity, and
    responding to market fluctuations for central banks.
  image: https://www.calypso.com/favicon.ico
  humanURL: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/reserve-and-monetary-policy-management
