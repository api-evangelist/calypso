  - Securities Finance
  - Risk
  properties:
  - type: Documentation
    url: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/collateral-margin-securities-finance
- name: Calypso Clearing API
  description: >-
    Provides access to Calypso integrated cross-asset OTC and exchange-traded
    derivatives clearing capabilities including trade connectivity, processing,
    collateral management and optimization, margin calculation, and
    reconciliation for clearing houses and clearing members.
  image: https://www.calypso.com/favicon.ico
  humanURL: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/clearing
  baseURL: https://api.calypso.example.com/v1
  tags:
