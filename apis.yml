  - Liquidity
  - Asset Management
  properties:
  - type: Documentation
    url: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/treasury
- name: Calypso Collateral, Margin and Securities Finance API
  description: >-
    Provides integration with Calypso collateral management, margin calculation,
    and securities financing capabilities. Supports management of exposures for
    cleared and uncleared trades, real-time collateral transfers, intraday
    margining, and automated margin call processing.
  image: https://www.calypso.com/favicon.ico
  humanURL: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/collateral-margin-securities-finance
  baseURL: https://api.calypso.example.com/v1
  tags:
  - Collateral Management
