apis:
- name: Calypso Core API
  description: >-
    Main REST API for the Nasdaq Calypso platform. Provides programmatic access
    to remotely control calls to the Calypso platform from other software,
    enabling regulatory analytics, current limits usage queries, and pre-deal
    limit checks for enhanced operating flexibility across capital markets
    operations.
  image: https://www.calypso.com/favicon.ico
  humanURL: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso
  baseURL: https://api.calypso.example.com/v1
