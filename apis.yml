    url: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso
- name: Calypso Front Office API
  description: >-
    Provides programmatic access to Calypso front office capabilities including
    real-time portfolio insights, instant order generation, pricing, live risk
    and P&L monitoring, trade entry, and scenario analysis across multiple asset
    classes for trading desks and portfolio managers.
  image: https://www.calypso.com/favicon.ico
  humanURL: https://www.nasdaq.com/solutions/fintech/nasdaq-calypso/front-office
  baseURL: https://api.calypso.example.com/v1
  tags:
  - Front Office
  - Trading
